services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    container_name: portfolio-mongo
    environment:
      MONGO_INITDB_DATABASE: portfolio
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - portfolio-network

  api:
    build:
      context: .
      target: development
    container_name: portfolio-api
    command: npm run dev
    env_file:
      - .env.development
    environment:
      - MONGODB_URI=mongodb://mongo:27017/portfolio
      - NODE_ENV=development
    volumes:
      - ./src:/app/src
      - ./tsconfig.json:/app/tsconfig.json
      - node_modules:/app/node_modules
    ports:
      - "4000:4000"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - portfolio-network
    stdin_open: true
    tty: true

  # Production build (uncomment to test production image locally)
  # api-prod:
  #   build:
  #     context: .
  #     target: runtime
  #   container_name: portfolio-api-prod
  #   env_file:
  #     - .env.production.example
  #   environment:
  #     - MONGODB_URI=mongodb://mongo:27017/portfolio
  #     - NODE_ENV=production
  #   ports:
  #     - "4001:4000"
  #   depends_on:
  #     mongo:
  #       condition: service_healthy
  #   networks:
  #     - portfolio-network

volumes:
  mongo_data:
  node_modules:

networks:
  portfolio-network:
    driver: bridge
