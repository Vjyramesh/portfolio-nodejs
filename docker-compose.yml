services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  api:
    build: .
    command: npm run dev
    env_file:
      - .env.development
    environment:
      - MONGODB_URI=mongodb://mongo:27017
    volumes:
      - ./src:/app/src
    ports:
      - "4000:4000"
    depends_on:
      - mongo

volumes:
  mongo_data:
